# Example of the drop-in `openqa-container install work` writes for the instance
# "work", as ~/.config/containers/systemd/openqa-agent@work.container.d/10-workdir.conf.
# Beside it install makes openqa-agent@work.container, a link to the template
# openqa-agent@.container: Quadlet reads an instance's drop-in only then. Without
# the launcher, write both by hand and create the podman secrets the template
# names, then: systemctl --user daemon-reload &&
# systemctl --user start openqa-agent@work
[Container]
# The work directory on the host, and where the agent sees it.
Volume=/home/user/agent-ws/work:/home/user/openqa:Z
WorkingDir=/home/user/openqa
# The image `update` pulls and the unit runs: here a published one.
Image=registry.example.org/agents/openqa-agent:latest
# Your git name and e-mail address, as a file of this instance.
Volume=/home/user/.config/skill-container/openqa/work.gitconfig:/home/agent/.config/git/config:ro,Z

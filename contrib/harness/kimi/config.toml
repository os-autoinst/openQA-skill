# Append to ~/.kimi-code/config.toml, copy openqa-credentials.py to ~/.kimi-code/hooks/, then run
# kimi doctor config ~/.kimi-code/config.toml
# One invalid [[hooks]] entry disables ALL hooks, so validate after every edit.
[[hooks]]
event = "PreToolUse"
matcher = "^(Bash|Read|ReadMediaFile|Grep|Glob|Write|Edit|FetchURL|mcp__.*)$"
command = 'python3 "$HOME/.kimi-code/hooks/openqa-credentials.py"'
timeout = 10

# Merge into ~/.grok/config.toml. deny beats ask and allow from every source and
# still applies under always-approve.
[permission]
deny = [
  # Path globs: read_file, grep (the path, plus ripgrep excludes), and files that
  # shell readers and redirects name (cat, head, sed, base64, < file, bash -c).
  # "~/" is literal here, so home paths use "**/"; "X/**" does not match X itself.
  "Read(**/.config/openqa)",
  "Read(**/.config/openqa/**)",
  "Read(/etc/openqa)",
  "Read(/etc/openqa/**)",
  "Read(/usr/etc/openqa)",
  "Read(/usr/etc/openqa/**)",
  "Read(**/.config/gh/hosts.yml)",
  "Read(**/.config/osc)",
  "Read(**/.config/osc/**)",
  "Read(**/.oscrc)",
  "Read(**/.config/tea)",
  "Read(**/.config/tea/**)",
  "Read(**/.netrc)",
  "Read(**/.git-credentials)",
  # Command globs, matched against the whole command and each segment;
  # "*" crosses spaces and "/".
  "Bash(*.config/openqa*)",
  "Bash(*etc/openqa*)",
  "Bash(*gh/hosts.yml*)",
  "Bash(*.config/osc*)",
  "Bash(*oscrc*)",
  "Bash(*.config/tea*)",
  "Bash(*.netrc*)",
  "Bash(*.git-credentials*)",
  "Bash(*gh auth token*)",
  "Bash(*gh auth status*)",
  "Bash(*gh auth git-credential*)",
  "Bash(*-H*uthorization*)",
  "Bash(*--header*uthorization*)",
  "Bash(*openqa-cli *uthorization*)",
  "Bash(*--apikey*)",
  "Bash(*--apisecret*)",
  "Bash(*://*:*@*)",
  "Bash(*MOJO_CLIENT_DEBUG*)",
  "Bash(git-obs *login list*)",
  "Bash(git obs *login list*)",
  "Bash(*gitcredentials-helper*)",
  "Bash(*login helper*)",
  "Bash(*logins helper*)",
  "Bash(*login git-credential*)",
  "Bash(*logins git-credential*)",
  "Bash(tea login e*)",
  "Bash(tea logins e*)",
  "Bash(*--dump-*)",
  "Bash(*--http-d*)",
  "Bash(*--http-f*)",
  "Bash(*http_debug*)",
  "Bash(*http_full_debug*)",
  "Bash(*HTTP_DEBUG*)",
  "Bash(*HTTP_FULL_DEBUG*)",
  "Bash(osc -H*)",
  "Bash(osc * -H *)",
  "Bash(osc * -H)",
  "Bash(osc token*)",
  "Bash(osc -qH*)",
  "Bash(osc -vH*)",
  "Bash(osc * -qH*)",
  "Bash(osc * -vH*)",
  "Bash(osc *api*/person/*/token*)",
  "Bash(osc config * pass*)",
  "Bash(*credential fill*)",
  "Bash(*credential-* get*)",
]

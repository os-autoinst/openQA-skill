# Copy to ~/.gemini/policies/openqa-credentials.toml (user tier).
# User tier: priority 999 -> 4.999, above YOLO allow-all (1.998) and
# "Allow for all future sessions" rules (3.950 / 4.950).
# commandRegex becomes '"command":"' + regex, hence the leading [^\x00]* to float it.
# The loader refuses a quantifier on a group that holds one, as in (a+)*. A later word is found
# in a lookahead, which JavaScript never backtracks into, so a long command stays fast. osc's
# token and config words count only before a quote, so a commit message may mention them.

[[rule]]
toolName = ["read_file", "read_many_files", "list_directory", "glob", "grep_search"]
argsPattern = '\.config/(openqa|gh|osc|tea)\b|etc/openqa\b|oscrc|\.netrc|\.git-credentials'
decision = "deny"
priority = 999
denyMessage = "Credential files (openQA, gh, osc, tea, netrc, git credentials) are off limits."

[[rule]]
toolName = "run_shell_command"
commandRegex = '[^\x00]*(\.config/(openqa|gh|osc|tea)\b|etc/openqa\b|oscrc|\.netrc|\.git-credentials|(-H|--header)[\s=]*\\?[\x27"]?\s*[Aa]uthorization\s*:|\bopenqa-cli\s(?=[^\x00]*?[Aa]uthorization\s*:)|--api(key|secret)|://[^\s/:@]+:[^\s/@]+@|MOJO_CLIENT_DEBUG)'
decision = "deny"
priority = 999
denyMessage = "Commands that read credentials or pass API keys are blocked; the tools use their own."

[[rule]]
toolName = "run_shell_command"
commandRegex = '[^\x00]*(\bgh\s+auth\s+(token|status|git-credential)\b|\bgit[- ]obs\s(?=[^\x00]*?\blogin\s+list\b)|gitcredentials-helper|\blogins?\s+(helper|git-credential)\b|\btea\s(?=[^\x00]*?\blogins?\s+(edit|e)\b)|--dump-|--http-[df]|(http|HTTP)[-_](debug|DEBUG|full[-_]debug|FULL[-_]DEBUG)|\bosc\s+-[a-zA-Z]*H\b|\bosc\s(?=[^\x00]*?\s-[a-zA-Z]*H\b)|\bosc\s+\\?[\x27"]?token\b|\bosc\s(?=[^\x00\x27"]*?\s\\?[\x27"]?token\b)|\bosc\s(?=[^\x00]*?/person/[^\s/]+/token)|\bosc\s(?=[^\x00\x27"]*?\bconfig\s)(?=[^\x00\x27"]*?\spassx?\b)|\bcredential\s+fill\b|\bgit[- ]credential-[\w.-]+\s+get\b)'
decision = "deny"
priority = 999
denyMessage = "This command prints a token or password; the tools use their credentials themselves."
